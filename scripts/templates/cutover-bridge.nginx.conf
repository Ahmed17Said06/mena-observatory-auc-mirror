# Cutover bridge — goes on the OLD server, at the moment the replica is promoted.
#
# While DNS propagates, some visitors still resolve menaobservatory.ai to the
# old Elastic IP. This vhost stops the old box serving the application and
# forwards everything to the new one instead, so those visitors are served by
# the new site and never see a stale copy or an error. That is what makes the
# transition seamless rather than a maintenance window.
#
#   1. Replace NEW_ELASTIC_IP below with the new server's address.
#   2. sudo cp cutover-bridge.nginx.conf /etc/nginx/sites-available/bridge
#   3. sudo ln -sf /etc/nginx/sites-available/bridge /etc/nginx/sites-enabled/observatory
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# Remove it once DNS has fully propagated (a day after the TTL expires) and the
# old instance is ready to be stopped.
#
# This assumes the new server already serves valid HTTPS for the domain, which
# is why the runbook copies /etc/letsencrypt across before this step: at this
# point DNS still points here, so certbot cannot validate on the new box yet.
#
# The live certificate covers the apex name only (menaobservatory.ai), even
# though www is a DNS alias for it. www is listed below so the bridge answers
# on it, but https://www. already warns today and will keep warning until the
# certificate is reissued with both names.
#
# The app must also be told to trust this proxy, or it will treat forwarded
# requests as plain HTTP and log this server's address as the visitor's. On
# the NEW server, before the bridge goes live:
#     TRUSTED_PROXIES=<old server public IP>   in .env
#     sudo -u www-data php artisan config:cache

upstream observatory_new {
    server NEW_ELASTIC_IP:443;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name menaobservatory.ai www.menaobservatory.ai;

    # Let certbot keep renewing on this box while it is still in the path.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name menaobservatory.ai www.menaobservatory.ai;

    # The old box's existing certificate — still valid, still trusted.
    ssl_certificate     /etc/letsencrypt/live/menaobservatory.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/menaobservatory.ai/privkey.pem;

    # Admin uploads (PDFs, images) must survive the hop.
    client_max_body_size 128M;

    access_log /var/log/nginx/bridge-access.log;
    error_log  /var/log/nginx/bridge-error.log;

    location / {
        proxy_pass https://observatory_new;

        # Present the real hostname to the new box, so Laravel builds correct
        # URLs and the upstream certificate matches.
        proxy_ssl_server_name on;
        proxy_ssl_name        menaobservatory.ai;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Serve the upstream's own redirects and cookies unchanged; the host
        # name is identical on both sides, so nothing needs rewriting.
        proxy_redirect off;
    }
}
